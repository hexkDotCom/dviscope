# Pure crate: no file system, network, environment, process, clock or
# randomness. Time, IDs and policies are passed in. (This file replaces the root clippy.toml
# for this crate, so the shared settings are repeated.)
doc-valid-idents = ["DVIScope", "DVICode", "SVUnit", "SimScope", "OpenTitan", "GitHub", "PostgreSQL", "WSL2", "NTSTATUS", "ECMAScript", "IEEE", "UTF-8", "UTF-16", "RFC", "..", "JSON", "UVM_FATAL", "UVM_ERROR", "SystemVerilog"]
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "pure crate: pass time in" },
    { path = "std::time::Instant::now", reason = "pure crate: pass time in" },
    { path = "time::OffsetDateTime::now_utc", reason = "pure crate: pass time in" },
    { path = "ulid::Ulid::new", reason = "pure crate: pass IDs in" },
    { path = "std::env::var", reason = "pure crate: no environment" },
    { path = "std::env::vars", reason = "pure crate: no environment" },
    { path = "std::env::var_os", reason = "pure crate: no environment" },
    { path = "std::env::args", reason = "pure crate: no environment" },
    { path = "std::env::vars_os", reason = "pure crate: no environment" },
    { path = "std::env::args_os", reason = "pure crate: no environment" },
    { path = "std::io::stderr", reason = "pure crate: no I/O" },
    { path = "std::io::stdin", reason = "pure crate: no I/O" },
    { path = "std::io::stdout", reason = "pure crate: no I/O" },
    { path = "std::fs::read", reason = "pure crate: no file system" },
    { path = "std::fs::read_to_string", reason = "pure crate: no file system" },
    { path = "std::fs::write", reason = "pure crate: no file system" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "pure crate: no file system" },
    { path = "std::fs::OpenOptions", reason = "pure crate: no file system" },
    { path = "std::net::TcpStream", reason = "pure crate: no network" },
    { path = "std::net::TcpListener", reason = "pure crate: no network" },
    { path = "std::net::UdpSocket", reason = "pure crate: no network" },
    { path = "std::process::Command", reason = "pure crate: no processes" },
]
